name: B17 Cameraman 660 nm noise ablation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [chatgpt/camera-alpha-sweep-20261114]
    paths:
      - '.github/workflows/b17-camera-noise-ablation.yml'
      - '싱글/코드/noise_ablation.py'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.head_ref == 'chatgpt/camera-noise-ablation-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [A, B, C, D, E, F]
    env:
      CASE: ${{ matrix.case }}
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve sealed baseline recovery
        uses: actions/download-artifact@v4
        with:
          name: cameraman-jacobian-660nm
          run-id: '43595625804'
          github-token: ${{ github.token }}
          path: baseline
      - name: Validate experiment contract
        run: |
          python -m py_compile 싱글/코드/noise_ablation.py
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from 공통.optics import digest,phase_check,geometry_for
          from 싱글.코드.noise_ablation import CASES,EXPECTED_SENSOR
          p=Path("baseline/fixed660")
          r=json.loads((p/"recovery.json").read_text())
          assert r["sensor_sha256"]==EXPECTED_SENSOR
          assert tuple(r["geometry"])==geometry_for(3800)
          with np.load(p/"recovered.npz",allow_pickle=False) as a:
              assert digest(phase_check(a["phase"]))==r["phase_sha256"]
          assert len(CASES)==6 and CASES["F"]==(0.,0.,"cold")
          print("SEALED BASELINE VERIFIED",r["phase_sha256"])
          PY
      - name: Run controlled noise ablation
        run: python -m 싱글.코드.noise_ablation --case "$CASE" --baseline baseline --output experiment
      - name: Preserve evidence and figures
        if: always()
        run: |
          python - <<'PY'
          import os,json,shutil
          from pathlib import Path
          from 싱글.코드.noise_ablation import CASES
          src=Path("experiment");out=Path("published");out.mkdir(exist_ok=True)
          case=os.environ["CASE"];noise,alpha,initial=CASES[case]
          (out/"case.json").write_text(json.dumps(dict(scene="camera",wavelength_nm=660,case=case,noise_pct_mean=noise,alpha=alpha,initialization=initial,commit=os.environ["GITHUB_SHA"],baseline_run=43595625804),indent=2))
          names={"experiment.json","diagnostics.json","generation.json","summary.json","recovery.json","evaluation.json","history.json","five_panel.png","convergence.png","sealed.npz","recovered.npz"}
          if src.is_dir():
              for p in src.rglob("*"):
                  if p.is_file() and p.name in names:
                      q=out/p.relative_to(src);q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
          if (src/"diagnostics.json").exists():
              d=json.loads((src/"diagnostics.json").read_text())
              e=json.loads((src/"experiment.json").read_text())
              r=json.loads((src/"inverse/recovery.json").read_text())
              assert e["sensor_sha256"]==r["sensor_sha256"]==d["generation"]["sensor_sha256"]
              assert e["initial_phase_sha256"]==r["initial_phase_sha256"]==d["initial_phase_sha256"]
              assert r["alpha"]==alpha and r["noise_pct_mean"]==noise
              assert e["geometry"]==[3800,1429,512,3000]
              print("NOISE AUDIT PASSED",json.dumps(d["scores"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera660-noise-${{ matrix.case }}
          path: published/
          retention-days: 30
          if-no-files-found: error
