name: B17 RBC wavelength-only validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [chatgpt/b17-original-blind-20261115]
    paths:
      - '.github/workflows/b17-rbc-wavelength-first.yml'
      - '싱글/코드/rbc_wavelength_only.py'
permissions:
  contents: read
jobs:
  identify:
    if: github.head_ref == 'chatgpt/b17-rbc-wavelength-first-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [normal440, normal550, normal587p6, triple440, triple550, triple587p6]
    env:
      CASE: ${{ matrix.case }}
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate code
        run: python -m py_compile 싱글/코드/rbc_wavelength_only.py
      - name: RBC wavelength search without phase reconstruction
        run: python -m 싱글.코드.rbc_wavelength_only --case "$CASE" --output experiment
      - name: Preserve wavelength diagnostics
        if: always()
        run: |
          python - <<'PY'
          import os,json,shutil
          from pathlib import Path
          src=Path("experiment");out=Path("published");out.mkdir(exist_ok=True)
          (out/"case.json").write_text(json.dumps(dict(case=os.environ["CASE"],commit=os.environ["GITHUB_SHA"]),indent=2))
          names={"experiment.json","evaluation.json","wavelength_search.json","generation.json"}
          if src.is_dir():
              for p in src.rglob("*"):
                  if p.is_file() and p.name in names:
                      q=out/p.relative_to(src);q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b17-rbc-wavelength-first-${{ matrix.case }}
          path: published/
          retention-days: 30
          if-no-files-found: error
