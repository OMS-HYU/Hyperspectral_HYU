name: Research contract
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m tests.test_contract
      - run: python -m single.run --help
      - run: python -m multi.run --wavelengths 500 660 --weights 1 1 --output /tmp/k2_plan
      - run: python -m continuum.run --start 440 --stop 660 --step 10 --output /tmp/continuum_plan
