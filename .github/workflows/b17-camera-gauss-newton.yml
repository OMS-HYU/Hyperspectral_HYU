name: B17 Cameraman 660 nm matrix-free Gauss-Newton
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [chatgpt/camera-noise-ablation-20261114]
    paths:
      - '.github/workflows/b17-camera-gauss-newton.yml'
      - '싱글/코드/gauss_newton.py'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.head_ref == 'chatgpt/camera-gauss-newton-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        case: [GN_clean_1e4, GN_clean_1e6, LBFGS_clean, GN_noise_1e4, LBFGS_noise]
    env:
      CASE: ${{ matrix.case }}
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve sealed best previous recovery
        uses: actions/download-artifact@v4
        with:
          name: camera660-regularization-alpha005
          run-id: '43604536423'
          github-token: ${{ github.token }}
          path: baseline
      - name: Validate sealed initialization
        run: |
          python -m py_compile 싱글/코드/gauss_newton.py
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from 공통.optics import digest,phase_check
          from 싱글.코드.gauss_newton import CASES
          p=Path("baseline/inverse")
          r=json.loads((p/"recovery.json").read_text())
          e=json.loads((p/"evaluation.json").read_text())
          assert r["alpha"]==.005 and r["completed"]
          assert abs(e["full_rmse_rad"]-.12986880384061672)<1e-12
          with np.load(p/"recovered.npz",allow_pickle=False) as a:
              assert digest(phase_check(a["phase"]))==r["phase_sha256"]
          assert len(CASES)==5
          print("SEALED BASELINE VERIFIED",r["phase_sha256"])
          PY
      - name: Run exact Jacobian matrix-free recovery
        run: python -m 싱글.코드.gauss_newton --case "$CASE" --baseline baseline --output experiment
      - name: Preserve audit and figures
        if: always()
        run: |
          python - <<'PY'
          import os,json,shutil
          from pathlib import Path
          from 싱글.코드.gauss_newton import CASES
          src=Path("experiment");out=Path("published");out.mkdir(exist_ok=True)
          case=os.environ["CASE"];noise,damping,method=CASES[case]
          (out/"case.json").write_text(json.dumps(dict(scene="camera",wavelength_nm=660,case=case,noise_pct_mean=noise,damping=damping,method=method,commit=os.environ["GITHUB_SHA"],baseline_run=43604536423),indent=2))
          names={"experiment.json","diagnostics.json","generation.json","jacobian_check.json","recovery.json","evaluation.json","history.json","five_panel.png","convergence.png","recovered.npz"}
          if src.is_dir():
              for p in src.rglob("*"):
                  if p.is_file() and p.name in names:
                      q=out/p.relative_to(src);q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
          if (src/"diagnostics.json").exists():
              d=json.loads((src/"diagnostics.json").read_text())
              e=json.loads((src/"experiment.json").read_text())
              r=json.loads((src/"inverse/recovery.json").read_text())
              assert e["sensor_sha256"]==r["sensor_sha256"]==d["same_sensor_sha256"]
              assert e["initial_phase_sha256"]==r["initial_phase_sha256"]==d["same_initial_phase_sha256"]
              assert e["geometry"]==[3800,1429,512,3000]
              print("GN AUDIT PASSED",json.dumps(d["scores"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera660-gn-${{ matrix.case }}
          path: published/
          retention-days: 30
          if-no-files-found: error
