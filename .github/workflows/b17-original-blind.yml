name: B17 original blind recovery
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [chatgpt/b17-original-generalization-20261115]
    paths:
      - '.github/workflows/b17-original-blind.yml'
      - '싱글/코드/original_blind.py'
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'chatgpt/b17-original-blind-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [camera440, camera550, camera660, camera587p6, pepper660, triple660, normal473p4]
    env:
      CASE: ${{ matrix.case }}
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate code
        run: python -m py_compile 싱글/코드/original_blind.py
      - name: Run sensor-only wavelength scan and phase recovery
        run: python -m 싱글.코드.original_blind --case "$CASE" --output experiment
      - name: Preserve results
        if: always()
        run: |
          python - <<'PY'
          import os,json,shutil
          from pathlib import Path
          src=Path("experiment");out=Path("published");out.mkdir(exist_ok=True)
          (out/"case.json").write_text(json.dumps(dict(case=os.environ["CASE"],commit=os.environ["GITHUB_SHA"]),indent=2))
          names={"experiment.json","comparison.json","blind_scan.json","generation.json","summary.json","recovery.json","evaluation.json","history.json","five_panel.png","convergence.png","sealed.npz","recovered.npz","private_truth.npz"}
          if src.is_dir():
              for p in src.rglob("*"):
                  if p.is_file() and p.name in names:
                      q=out/p.relative_to(src);q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b17-original-blind-${{ matrix.case }}
          path: published/
          retention-days: 30
          if-no-files-found: error
